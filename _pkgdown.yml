url: https://gillescolling.com/linop/

template:
  bootstrap: 5
  bootswatch: sandstone
  light-switch: yes

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github, lightswitch]

articles:
- title: Getting started
  navbar: Getting started
  contents:
  - linop
- title: Core concepts
  navbar: Core concepts
  contents:
  - expressions
  - capabilities
- title: Solving
  navbar: Solving
  contents:
  - solvers
  - spectral
  - sequence-spaces
  - certificates
- title: Extending
  navbar: Extending
  contents:
  - adapters

reference:
- title: Build an operator
  desc: >
    One generic dispatching on its first argument, plus named constructors for
    the operators that appear constantly inside expressions.
  contents:
  - linop
  - linop_eye
  - linop_scaling
  - is_linop
  - dtype
- title: Operators on a sequence space
  desc: >
    An operator whose index set is infinite, the truncation that makes it
    computable, and the rate its eigenvectors decay at. What comes back from the
    truncation is an ordinary operator, and what comes back from a spectral
    computation on it is a statement about the operator underneath.
  contents:
  - linop_jacobi
  - finite_section
  - decay_rate
- title: Views
  desc: The conjugate transpose, distinct from the transpose.
  contents:
  - adjoint
- title: Inspect and cost an expression
  desc: >
    Read the structure of a lazy expression, estimate its cost, and trade cost
    for memory where that pays.
  contents:
  - explain
  - linop_cost
  - collapse
- title: Form a matrix, deliberately
  desc: Explicit materialisation, guarded on size.
  contents:
  - as.matrix.linop
  - as_sparse
- title: Capabilities and evidence
  desc: >
    What an operator knows about itself, the argument that established it, and
    what a solver will accept.
  contents:
  - cap
  - capability
  - evidence
  - evidence_satisfies
  - requirement
- title: Check a claim
  desc: The conformance suite an adapter author runs before shipping.
  contents:
  - verify
- title: Solve a system
  desc: >
    One verb over seven Krylov methods, choosing on declared capabilities and
    shape, returning what a matrix solve returns with a certificate attached.
  contents:
  - solve.linop
- title: Eigenvalues and singular values
  desc: >
    Restarted Lanczos with full reorthogonalisation, and the same loop on the
    augmented operator. Each pair carries a backward error and a bound on how
    far the value can be from an exact one.
  contents:
  - eigs
  - svds
- title: Preconditioners
  desc: >
    One direction internally, and a contract each method enforces at the point
    the preconditioner is accepted.
  contents:
  - preconditioner
  - as_preconditioner
  - as_preconditioner_inverse
- title: internal
  contents:
  - promote
